name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build all targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          check-latest: true
          cache: false

      - name: go build (cross-compile linux/darwin/windows)
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build.sh

      - name: smoke test (native linux-x64)
        run: |
          ./dist/claude-gisx-linux-x64 version
          echo '{"model":{"display_name":"Opus"},"context_window":{"used_percentage":15}}' \
            | ./dist/claude-gisx-linux-x64

      - name: compute checksums
        run: |
          cd dist
          sha256sum claude-gisx-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/claude-gisx-*
            dist/SHA256SUMS
          generate_release_notes: true
