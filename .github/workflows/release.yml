name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            ext: ""
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            ext: ""
          - target: darwin-arm64
            runner: macos-14
            ext: ""
          - target: windows-x64
            runner: windows-latest
            ext: ".exe"
    defaults:
      run:
        # Bash via Git Bash on windows-latest; native bash elsewhere.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: build
        run: ./scripts/build.sh ${{ matrix.target }}

      - name: smoke test (native target only)
        if: matrix.target == 'linux-x64' && runner.os == 'Linux'
        run: |
          ./dist/claude-gisx-${{ matrix.target }} version
          echo '{"model":{"display_name":"Opus"},"context_window":{"used_percentage":15}}' \
            | ./dist/claude-gisx-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: claude-gisx-${{ matrix.target }}
          path: dist/claude-gisx-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list artifacts
        run: ls -lh dist/

      - name: compute checksums
        run: |
          cd dist
          sha256sum claude-gisx-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/claude-gisx-*
            dist/SHA256SUMS
          generate_release_notes: true
